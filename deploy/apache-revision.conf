# Vhost modèle pour revision.funnelforge.fr (Apache 2.4).
# Modules : a2enmod proxy proxy_http headers ssl rewrite
# Le certificat (ex. certbot --apache -d revision.funnelforge.fr) est à poser par l'administrateur.
<VirtualHost *:80>
    ServerName revision.funnelforge.fr
    RewriteEngine On
    RewriteRule ^/?(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName revision.funnelforge.fr

    SSLEngine On
    SSLCertificateFile    /etc/letsencrypt/live/revision.funnelforge.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/revision.funnelforge.fr/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    # X-Forwarded-For est ajouté par mod_proxy ; le serveur ne fait confiance qu'au proxy local (trust proxy loopback).

    # Pas de mise en mémoire tampon, délais larges pour le connecteur MCP
    <Location "/mcp">
        ProxyPass        http://127.0.0.1:8650/mcp flushpackets=on disablereuse=on timeout=120
        ProxyPassReverse http://127.0.0.1:8650/mcp
        SetEnv proxy-sendchunked 1
        SetEnv proxy-initial-not-pooled 1
        SetEnv no-gzip 1
    </Location>

    ProxyPass        / http://127.0.0.1:8650/ timeout=60
    ProxyPassReverse / http://127.0.0.1:8650/

    LimitRequestBody 12582912

    Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog  ${APACHE_LOG_DIR}/revision-error.log
    # Journal sans query string (%U au lieu de %r) : les codes OAuth passent dans l'URL.
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" revision_sans_query
    CustomLog ${APACHE_LOG_DIR}/revision-access.log revision_sans_query
</VirtualHost>
